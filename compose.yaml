services:
  knowledge-db:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_DB: psb_knowledge
      POSTGRES_USER: psb_knowledge_admin
      POSTGRES_PASSWORD: ${PSB_KNOWLEDGE_ADMIN_PASSWORD:?Set PSB_KNOWLEDGE_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PSB_KNOWLEDGE_PORT:-5433}:5432"
    volumes:
      - knowledge-data:/var/lib/postgresql/data
      - ./migrations/001_knowledge.sql:/docker-entrypoint-initdb.d/001_knowledge.sql:ro
    networks:
      - knowledge
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "psb_knowledge_admin", "-d", "psb_knowledge"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: psb-api:local
    build: .
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      PSB_KNOWLEDGE_ADMIN_PASSWORD: ${PSB_KNOWLEDGE_ADMIN_PASSWORD:?Set PSB_KNOWLEDGE_ADMIN_PASSWORD in .env}
      PSB_DATABASE_HOST: knowledge-db
    depends_on:
      knowledge-db:
        condition: service_healthy
    networks: [knowledge]

  api:
    image: psb-api:local
    build: .
    environment:
      PSB_DATABASE_URL: ${PSB_CONTAINER_DATABASE_URL:-}
      PSB_DATABASE_HOST: knowledge-db
      PSB_KNOWLEDGE_ADMIN_PASSWORD: ${PSB_KNOWLEDGE_ADMIN_PASSWORD:?Set PSB_KNOWLEDGE_ADMIN_PASSWORD in .env}
      PSB_COOKIE_SECURE: ${PSB_COOKIE_SECURE:-false}
      PSB_CORS_ORIGINS: ${PSB_CORS_ORIGINS:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      DEEPSEEK_TIMEOUT: ${DEEPSEEK_TIMEOUT:-60}
      # Uvicorn принимает forwarded-заголовки только от frontend Nginx.
      FORWARDED_ALLOW_IPS: ${PSB_FRONTEND_PROXY_IP:-172.30.80.2}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [knowledge, web]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    environment:
      API_UPSTREAM: http://api:8000
      PSB_PUBLIC_SCHEME: ${PSB_PUBLIC_SCHEME:-http}
    ports:
      - "127.0.0.1:${PSB_SITE_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      web:
        ipv4_address: ${PSB_FRONTEND_PROXY_IP:-172.30.80.2}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  knowledge-data:

networks:
  knowledge:
  web:
    ipam:
      config:
        - subnet: ${PSB_WEB_SUBNET:-172.30.80.0/24}
          # Динамические адреса API не пересекаются со статическим адресом Nginx.
          ip_range: ${PSB_WEB_DYNAMIC_RANGE:-172.30.80.128/25}
